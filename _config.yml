# Site settings
lang: en
timezone: Europe/Skopje
title: Liul Sintayehu Tebkew
tagline: Cybersecurity • AI for Security • Technical Projects
description: >-
  Cybersecurity student portfolio featuring hands-on security labs,
  SOC investigation, threat detection, networking, and applied AI projects.
url: "https://LiulSintayehuTebkew.github.io"
baseurl: ""
email: ""

github:
  username: LiulSintayehuTebkew

# Lightweight, dependency-free category taxonomy.
portfolio_categories:
  - slug: cybersecurity
    name: Cybersecurity
    icon: CS
    description: Security projects, labs, monitoring, and investigation write-ups.
  - slug: networking
    name: Networking
    icon: NW
    description: Networking projects and infrastructure work will appear here.
  - slug: salesforce
    name: Salesforce
    icon: SF
    description: Salesforce projects and platform work will appear here.
  - slug: data-analysis
    name: Data Analysis
    icon: DA
    description: Data analysis projects and write-ups will appear here.

collections:
  tabs:
    output: true
    sort_by: order
  notes:
    output: true
    sort_by: date

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      permalink: /notes/:title/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

exclude:
  - Gemfile
  - README.md
  - LICENSE
  - docs
  - tools
  - "*.gem"
  - "*.gemspec"
  - "*.config.js"
  - package.json
  - package-lock.json
