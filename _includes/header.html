<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
      <span class="brand-mark" aria-hidden="true">LT</span>
      <span class="brand-text">
        {{ site.title | escape }}
        <small>Portfolio</small>
      </span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
      <span aria-hidden="true"></span>
    </button>

    <nav class="nav" id="site-nav" data-nav aria-label="Primary navigation">
      <ul class="nav-list">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li class="nav-projects">
          <div class="projects-nav">
            <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
            <button class="projects-toggle" type="button" data-projects-toggle aria-expanded="false" aria-controls="projects-menu" aria-label="Show project categories">
              <span aria-hidden="true">▾</span>
            </button>
          </div>
          <div class="projects-menu" id="projects-menu">
            {% for category in site.portfolio_categories %}
              {% assign category_url = '/projects/' | append: category.slug | append: '/' %}
              <a href="{{ category_url | relative_url }}"{% if page.url == category_url %} aria-current="page"{% endif %}>{{ category.name | escape }}</a>
            {% endfor %}
          </div>
        </li>
        <li><a href="{{ '/posts/' | relative_url }}"{% if page.url contains '/posts/' %} aria-current="page"{% endif %}>Posts</a></li>
      </ul>
    </nav>

    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme">☾</button>
  </div>
</header>
