# The Site Configuration
theme: jekyll-theme-chirpy

lang: en
timezone: Europe/Skopje

title: Liul Sintayehu Tebkew
tagline: Cybersecurity • AI for Security • Technical Projects
description: >
  Cybersecurity graduate-level portfolio featuring hands-on security labs,
  SOC investigation, threat detection, networking, and applied AI projects.

url: "https://LiulSintayehuTebkew.github.io"
baseurl: ""

github:
  username: LiulSintayehuTebkew

social:
  name: Liul Sintayehu Tebkew
  email:
  links:
    - https://github.com/LiulSintayehuTebkew

theme_mode:
toc: true

# Chirpy site settings
paginate: 10

# Keep the theme's built-in defaults for comments, analytics, and page views.
comments:
  provider:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

pwa:
  enabled: true
  cache:
    enabled: false
    deny_paths:

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
