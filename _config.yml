# Site settings
lang: en
timezone: Europe/Skopje
title: Liul Sintayehu Tebkew
tagline: Cybersecurity • AI for Security • Technical Projects
description: >-
  Cybersecurity graduate-level portfolio featuring hands-on security labs,
  SOC investigation, threat detection, networking, and applied AI projects.
url: "https://LiulSintayehuTebkew.github.io"
baseurl: ""
email: ""

github:
  username: LiulSintayehuTebkew

# Lightweight, dependency-free category taxonomy.
portfolio_categories:
  - slug: cybersecurity
    name: Cybersecurity
    icon: CS
    description: The complete collection of security projects, labs, and investigations.
  - slug: security-operations
    name: Security Operations
    icon: SO
    description: SIEM monitoring, alert triage, incident response, and SOC workflows.
  - slug: threat-detection
    name: Threat Detection
    icon: TD
    description: Detection engineering and investigation of suspicious activity.
  - slug: detection-engineering
    name: Detection Engineering
    icon: DE
    description: Practical detection logic for Windows, Active Directory, and SIEM data.
  - slug: ai-security
    name: AI for Security
    icon: AI
    description: Local language models and automation applied to security analysis.
  - slug: network-security
    name: Network Security
    icon: NS
    description: Packet analysis, malware traffic analysis, and network defense.
  - slug: email-security
    name: Email Security
    icon: ES
    description: Phishing analysis, email header inspection, and message threat intelligence.

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

exclude:
  - Gemfile
  - README.md
  - LICENSE
  - docs
  - tools
  - "*.gem"
  - "*.gemspec"
  - "*.config.js"
  - package.json
  - package-lock.json
