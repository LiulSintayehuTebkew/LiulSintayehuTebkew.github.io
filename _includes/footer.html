<footer class="site-footer">
  <div class="container footer-inner">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.title | escape }}.</span>
    <ul class="footer-links">
      <li><a href="#top">Back to top</a></li>
      {% if site.github.username %}
        <li><a href="https://github.com/{{ site.github.username | escape }}" rel="noopener noreferrer">GitHub</a></li>
      {% endif %}
      {% if site.email %}
        <li><a href="mailto:{{ site.email | escape }}">Email</a></li>
      {% endif %}
    </ul>
  </div>
</footer>
