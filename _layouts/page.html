---
layout: default
---
{% if page.shell == false %}
  {{ content }}
{% else %}
  <div class="container">
    <header class="page-head">
      <h1>{{ page.title | escape }}</h1>
      {% if page.description %}
        <p>{{ page.description | escape }}</p>
      {% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
{% endif %}
